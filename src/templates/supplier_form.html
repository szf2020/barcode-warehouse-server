{% extends "base.html" %}
{% block title %}{{ '編輯供應商' if supplier else '新增供應商' }} — 倉管系統{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">
                    <i class="bi bi-{{ 'pencil' if supplier else 'plus-lg' }}"></i>
                    {{ '編輯供應商' if supplier else '新增供應商' }}
                </h5>
            </div>
            <div class="card-body">
                <form method="post"
                      action="/web/suppliers/{{ supplier.id ~ '/edit' if supplier else 'new' }}">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label for="code" class="form-label">供應商編號 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="code" name="code"
                                   value="{{ supplier.code if supplier else '' }}" required
                                   placeholder="e.g. S001">
                        </div>
                        <div class="col-md-8">
                            <label for="name" class="form-label">供應商名稱 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="name" name="name"
                                   value="{{ supplier.name if supplier else '' }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="contact_person" class="form-label">聯絡人</label>
                            <input type="text" class="form-control" id="contact_person" name="contact_person"
                                   value="{{ supplier.contact_person or '' }}">
                        </div>
                        <div class="col-md-6">
                            <label for="phone" class="form-label">電話</label>
                            <input type="text" class="form-control" id="phone" name="phone"
                                   value="{{ supplier.phone or '' }}">
                        </div>
                        <div class="col-md-6">
                            <label for="tax_id" class="form-label">統一編號</label>
                            <input type="text" class="form-control" id="tax_id" name="tax_id"
                                   value="{{ supplier.tax_id or '' }}" maxlength="8">
                        </div>
                        <div class="col-md-6">
                            <label for="bank_account" class="form-label">匯款帳號</label>
                            <input type="text" class="form-control" id="bank_account" name="bank_account"
                                   value="{{ supplier.bank_account or '' }}">
                        </div>
                        <div class="col-12">
                            <label for="address" class="form-label">地址</label>
                            <input type="text" class="form-control" id="address" name="address"
                                   value="{{ supplier.address or '' }}">
                        </div>
                        <div class="col-12">
                            <label for="notes" class="form-label">備註</label>
                            <textarea class="form-control" id="notes" name="notes"
                                      rows="2">{{ supplier.notes or '' }}</textarea>
                        </div>
                    </div>
                    <div class="mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> {{ '儲存' if supplier else '建立' }}
                        </button>
                        <a href="/web/suppliers" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> 返回
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
